name: lambdalab-ec-pago-ms-dev

services:
  postgres-ec-pago-ms-dev:
    image: postgres:16-alpine
    container_name: lambdalab-postgres-ec-pago-ms-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_ec_pago_ms
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom
    ports:
      - "49030:5432"
    volumes:
      - lambdalab_postgres_ec_pago_ms_dev_data:/var/lib/postgresql/data

volumes:
  lambdalab_postgres_ec_pago_ms_dev_data:
