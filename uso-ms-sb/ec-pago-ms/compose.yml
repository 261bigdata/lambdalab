name: lambdalab-ec-pago-ms

services:
  postgres-ec-pago-ms:
    image: postgres:16-alpine
    container_name: lambdalab-postgres-ec-pago-ms
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "49030:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - lambdalab_postgres_ec_pago_ms_data:/var/lib/postgresql/data
    networks:
      - lambdalab-ec-pago-ms-net

  ec-pago-ms:
    build: .
    container_name: lambdalab-ec-pago-ms
    restart: unless-stopped
    depends_on:
      postgres-ec-pago-ms:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EC_KAFKA_BOOTSTRAP_SERVERS: ${EC_KAFKA_BOOTSTRAP_SERVERS}
      DB_HOST: lambdalab-postgres-ec-pago-ms
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    volumes:
      - ./logs:/app/logs
    ports:
      - "49031:8080"
    networks:
      - lambdalab-ec-pago-ms-net
      - lambdalab-kafka-net

volumes:
  lambdalab_postgres_ec_pago_ms_data:

networks:
  lambdalab-ec-pago-ms-net:
    name: lambdalab-ec-pago-ms-net
  lambdalab-kafka-net:
    external: true
    name: lambdalab-kafka-net
